# A pull request that changes the listing of packs, the folder catalog/ (docs/catalog.md): most often one that adds a
# pack's own file, catalog/packs/<id>.json. The listing held to the one before the change, the folder as main had it
# (one file, catalog/packs.json, before 2026-11-25), and every entry that changed held to its file, downloaded from its
# author's repository at the entry's commit. The review still reads the pack's source and tries the file on a unit: a
# green run says neither. It runs on Linux, whose disk keeps two names alike but for small letters and capitals apart,
# so the check sees every file a pull request adds.
name: listing

on:
  pull_request:
    paths: ["catalog/**"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The listing before the change
        env:
          BEFORE: ${{ github.event.pull_request.base.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/before" "$BEFORE"

      - name: The listing, held to the one before and to the files that changed
        run: python -I tools/catalog_check.py --before "$RUNNER_TEMP/before/catalog" --fetch
