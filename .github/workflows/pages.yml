# The install page on the host's pages: the folder builder/ as it stands on main, served over HTTPS, which the page's
# USB MIDI and folder access need (builder/README.md, "On a host's pages"). It is published once the checks have
# passed on main, or by hand. The host's pages are switched on once in the repository's settings, with this workflow
# as their source.
#
# builder/ always holds the released base, builder/base.pack, even when the base's sources on main are ahead of it:
# a change to the base is merged first and released later, by the maintainer's own pull request, which writes
# builder/base.pack and what names it (tools/build_all.py --update --base-version N --release X.Y). Until then the page
# keeps putting the last released base on every unit it installs.
name: pages

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A green run of the checks on a push to main of this repository: not a fork's own branch named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The page reads the listing of packs beside it, as packs.json (builder/catalog.mjs): the files of catalog/ as
      # they stand on main, joined into one, so that a pull request that adds a pack adds one file of its own.
      - name: The listing of packs beside the page
        run: python -I tools/catalog_check.py --join builder/packs.json

      - name: The folder served
        uses: actions/upload-pages-artifact@v3
        with:
          path: builder

      - id: publish
        uses: actions/deploy-pages@v4
